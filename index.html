<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#171324" />
  <title>Deutsch Adventure</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="preload" href="/assets/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <main id="stage-shell" aria-label="Deutsch Adventure">
    <section id="main-menu" class="menu-screen" aria-labelledby="menu-title">
      <div class="menu-content">
        <p class="menu-eyebrow">Deutsch Adventure</p>
        <h1 id="menu-title">Deutsch Adventure</h1>
        <p id="menu-tagline" class="menu-tagline"></p>
        <ul class="menu-feature-strip" aria-label="Ringkasan permainan">
          <li><span class="menu-feature-icon" aria-hidden="true">10</span><span id="menu-feature-time">MENIT</span></li>
          <li><span class="menu-feature-icon" aria-hidden="true">2+</span><span id="menu-feature-multiplayer">MULTIPLAYER</span></li>
          <li><span class="menu-feature-icon" aria-hidden="true">DE</span><span id="menu-feature-adventure">PETUALANGAN</span></li>
        </ul>
        <nav id="menu-actions" class="menu-actions" aria-label="Menu utama">
          <button id="menu-host" type="button"></button>
          <button id="menu-join" type="button"></button>
          <button id="menu-settings" type="button"></button>
        </nav>
        <section id="menu-form" class="menu-form" hidden></section>
        <section id="menu-settings-panel" class="menu-form" hidden>
          <h2 id="settings-title"></h2>
          <p id="settings-language-label"></p>
          <div id="menu-language-options" class="menu-languages"></div>
          <button id="settings-back" class="menu-secondary" type="button"></button>
        </section>
        <p id="menu-message" class="menu-message" role="status" aria-live="polite"></p>
      </div>
    </section>
    <div id="game" hidden></div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
