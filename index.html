<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#171324" />
  <title>BAI PARTY GAMES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main id="stage-shell" aria-label="BAI PARTY GAMES">
    <section id="main-menu" class="menu-screen" aria-labelledby="menu-title">
      <div class="menu-skyline" aria-hidden="true">
        <div class="menu-city-label">MÜNCHEN · DEUTSCHLAND</div>
        <div class="menu-characters" aria-label="Karakter pemain"><canvas class="menu-avatar hero-one" width="96" height="112" aria-hidden="true"></canvas><canvas class="menu-avatar hero-two" width="96" height="112" aria-hidden="true"></canvas><canvas class="menu-avatar hero-three" width="96" height="112" aria-hidden="true"></canvas><canvas class="menu-avatar hero-four" width="96" height="112" aria-hidden="true"></canvas></div>
      </div>
      <img class="menu-banner" src="/assets/ref/menu-banner.png" alt="BAI PARTY GAMES — München, Marienplatz, kereta ICE" />
      <div class="menu-content pixel-box">
        <p class="menu-eyebrow">✦ PLAY · QUIZ · WIN · TOGETHER ✦</p>
        <h1 id="menu-title"><span>BAI</span> PARTY GAMES</h1>
        <p id="menu-tagline" class="menu-tagline">PETUALANGAN QUIZ MULTIPLAYER DI JERMAN</p>
        <nav id="menu-actions" class="menu-actions" aria-label="Menu utama">
          <button id="menu-play" class="menu-play" type="button">▶ PLAY</button>
          <button id="menu-customize" class="menu-customize" type="button">♟ CUSTOMIZATION</button>
          <button id="menu-leaderboard" class="menu-leaderboard" type="button">🏆 LEADERBOARD</button>
          <button id="menu-settings" class="menu-settings" type="button">⚙ PENGATURAN</button>
          <button id="menu-quit" class="menu-quit" type="button">↪ QUIT</button>
        </nav>
        <section id="menu-play-options" class="menu-form menu-play-options" hidden>
          <h2>PILIH MODE BERMAIN</h2>
          <button id="menu-host" type="button">BUAT ROOM · TV HOST</button>
          <button id="menu-join" type="button">GABUNG ROOM · HP PLAYER</button>
          <button id="menu-play-back" class="menu-secondary" type="button">KEMBALI</button>
        </section>
        <section id="menu-form" class="menu-form" hidden></section>
        <section id="menu-settings-panel" class="menu-form" hidden>
          <h2 id="settings-title"></h2>
          <p id="settings-language-label"></p>
          <div id="menu-language-options" class="menu-languages"></div>
          <button id="settings-back" class="menu-secondary" type="button"></button>
        </section>
        <section id="menu-info-panel" class="menu-form" hidden>
          <h2 id="menu-info-title">BAI PARTY GAMES</h2>
          <p id="menu-info-copy">Buat room di TV, lalu pemain bergabung lewat HP menggunakan kode room.</p>
          <button id="menu-info-back" class="menu-secondary" type="button">KEMBALI</button>
        </section>
        <p id="menu-message" class="menu-message" role="status" aria-live="polite"></p>
      </div>
      <img class="menu-journey" src="/assets/ref/journey-strip.png" alt="Alur perjalanan: München, Frankfurt, Berlin, Hamburg, Ranking Akhir" />
      <div class="menu-footer">MÜNCHEN → FRANKFURT → BERLIN → HAMBURG <span>·</span> 1–4 PLAYERS</div>
    </section>
    <div id="game" hidden></div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
